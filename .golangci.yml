# golangci-lint configuration (v2 schema). Run with: golangci-lint run
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # Test stubs and helpers can be looser.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/figverse/gcloudenv
