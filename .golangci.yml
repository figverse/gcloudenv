# golangci-lint configuration. Run with: golangci-lint run
run:
  timeout: 3m
  go: '1.24'

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert

linters-settings:
  goimports:
    local-prefixes: github.com/figverse/gcloudenv

issues:
  exclude-rules:
    # Test stubs and helpers can be looser.
    - path: _test\.go
      linters:
        - errcheck
