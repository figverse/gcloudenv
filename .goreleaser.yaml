version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gcloudenv
    main: .
    binary: gcloudenv
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/figverse/gcloudenv/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# release-please owns the changelog and creates the GitHub Release; GoReleaser
# only attaches the built artifacts to that existing release.
changelog:
  disable: true

release:
  mode: keep-existing

brews:
  - repository:
      owner: figverse
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/figverse/gcloudenv"
    description: "Manage gcloud configurations like nvm/rbenv"
    license: "MIT"
    install: |
      bin.install "gcloudenv"
      system "/usr/bin/xattr", "-cr", "#{bin}/gcloudenv" if OS.mac?
    test: |
      system "#{bin}/gcloudenv", "--version"
    caveats: |
      Add the shell integration to your rc file:
        eval "$(gcloudenv init zsh)"
