version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gcloudenv
    main: .
    binary: gcloudenv
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/figverse/gcloudenv/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# release-please owns the changelog and creates the GitHub Release; GoReleaser
# only attaches the built artifacts to that existing release.
changelog:
  disable: true

release:
  mode: keep-existing

homebrew_casks:
  - repository:
      owner: figverse
      name: homebrew-tap
      # GITHUB_TOKEN can't push to a separate repo; use a PAT with write access
      # to the tap (set the HOMEBREW_TAP_GITHUB_TOKEN secret in this repo).
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/figverse/gcloudenv"
    description: "Manage gcloud configurations like nvm/rbenv"
    license: "MIT"
    caveats: |
      Add the shell integration to your rc file:
        eval "$(gcloudenv init zsh)"
    hooks:
      post:
        # Strip the macOS quarantine attribute so Gatekeeper doesn't block the
        # unsigned binary on first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gcloudenv"]
          end
