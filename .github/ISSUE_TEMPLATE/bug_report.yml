name: Bug report
description: Report a problem with gcloudenv
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please don't report security
        issues here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        Steps to reproduce:
        1. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gcloudenv version
      description: Output of `gcloudenv --version`
      placeholder: gcloudenv version v0.1.0
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [zsh, bash, fish, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: macOS 14 arm64
    validations:
      required: true
  - type: input
    id: gcloud-version
    attributes:
      label: gcloud version
      description: Output of `gcloud --version` (first line)
    validations:
      required: false
