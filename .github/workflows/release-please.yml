name: Release

on:
  push:
    branches: [main]
  # Manually (re)attach artifacts to an existing release/tag, e.g. to recover a
  # release whose goreleaser job failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v1.4.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a "release PR" that bumps the version and CHANGELOG from
  # Conventional Commits. Merging that PR creates the git tag + GitHub Release.
  # Skipped on manual dispatch — we only want goreleaser to run then.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please just cut a release. Builds the
  # cross-platform binaries and uploads them to that release.
  goreleaser:
    needs: release-please
    # Run when release-please just cut a release, or on a manual dispatch.
    # !cancelled() lets this run even though release-please is skipped on dispatch.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
